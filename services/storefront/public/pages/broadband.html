<section class="narrow">
  <h1>Get broadband</h1>
  <p class="lead">Check your postcode, pick a speed, and we book your install.</p>
  <form class="form" data-endpoint="orders" data-type="broadband" novalidate>
    <div class="field" data-customer-field><label for="customerId">Customer ID</label><input id="customerId" name="customerId" autocomplete="off" required><p class="hint">You get this when you <a href="/account/new">create an account</a>.</p></div>
    <div class="field"><label for="postcode">Postcode</label><input id="postcode" name="postcode" autocomplete="postal-code" required placeholder="M1 1AA"></div>
    <fieldset class="field"><legend>Speed</legend><div class="plan-pick" data-plans="broadband" aria-live="polite"><p class="muted">Loading plans</p></div></fieldset>
    <button class="btn btn-primary btn-lg" type="submit">Pay and order</button>
  </form>
  <section class="result" id="result" role="status" tabindex="-1" hidden></section>
</section>
