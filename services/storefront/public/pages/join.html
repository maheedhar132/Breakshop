<section class="narrow">
  <h1>Create your account</h1>
  <p class="lead">One account for your SIM, broadband and top-ups. It takes a minute.</p>
  <form class="form" data-endpoint="accounts" novalidate>
    <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><p class="hint">We send your receipts here.</p></div>
    <div class="field"><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required></div>
    <div class="field"><label for="idDoc">ID document number</label><input id="idDoc" name="idDoc" autocomplete="off" required><p class="hint">Passport or driving licence. We use it to verify who you are.</p></div>
    <button class="btn btn-primary btn-lg" type="submit">Create account</button>
  </form>
  <section class="result" id="result" role="status" tabindex="-1" hidden></section>
</section>
