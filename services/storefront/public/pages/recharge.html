<section class="narrow">
  <h1>Top up</h1>
  <p class="lead">Add credit to your account in seconds.</p>
  <form class="form" data-endpoint="orders" data-type="recharge" novalidate>
    <div class="field" data-customer-field><label for="customerId">Customer ID</label><input id="customerId" name="customerId" autocomplete="off" required><p class="hint">You get this when you <a href="/account/new">create an account</a>.</p></div>
    <fieldset class="field"><legend>Amount</legend>
      <div class="quick" role="group" aria-label="Quick amounts">
        <button type="button" class="chip" data-amount="5">5</button>
        <button type="button" class="chip" data-amount="10">10</button>
        <button type="button" class="chip" data-amount="20">20</button>
        <button type="button" class="chip" data-amount="30">30</button>
      </div>
      <label class="sr-only" for="amount">Amount</label>
      <input id="amount" name="amount" type="number" min="1" max="200" step="1" value="10" inputmode="numeric" required>
    </fieldset>
    <button class="btn btn-primary btn-lg" type="submit">Pay and top up</button>
  </form>
  <section class="result" id="result" role="status" tabindex="-1" hidden></section>
</section>
